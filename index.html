<script>

><div><small>Biên soạn & thiết kế khóa học</small><b>Đặng Thanh Bình</b><a href="mailto:dangthanhbinh53@gmail.com">dangthanhbinh53@gmail.com</a><p>© 2026 Đặng Thanh Bình. Bản quyền thuộc về tác giả đối với phần biên soạn tiếng Việt, ví dụ minh họa, thiết kế và phần mềm khóa học. Nội dung gốc EHEDG Doc. 50 © EHEDG.</p></div></section><p class="small">Nội dung diễn giải từ bản tháng 7/2019 do người dùng cung cấp. Không phải bản dịch chính thức, chương trình chứng nhận EHEDG hoặc đặc tả thiết kế cho một nhà máy cụ thể.</p>`}

function slideView(id){const s=C.slides.find(x=>x.id===id);if(!s)return home();const m=C.modules[s.module-1],siblings=moduleSlides(s.module),idx=siblings.findIndex(x=>x.id===id);return `<div class="row between no-print" style="margin-bottom:18px"><span class="pill">Bài ${s.module} / 8 · ${esc(m.title)}</span><button data-present>${document.body.classList.contains('present')?'Thoát trình chiếu':'⛶ Trình chiếu'}</button></div><article class="lesson"><header class="lesson-head" data-n="${String(id).padStart(2,'0')}"><div class="eyebrow">${String(id).padStart(2,'0')} / ${C.slides.length} &nbsp; · &nbsp; ${idx+1} / 4 TRONG BÀI</div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p></header><div class="grid">${s.cards.map((c,i)=>`<section class="card"><span class="index">0${i+1}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></section>`).join('')}</div>${s.example?`<aside class="example"><small>Ví dụ từ hiện trường <i>· tình huống minh họa</i></small>${esc(s.example)}</aside>`:''}${visual(s.visual)}<div class="takeaway"><small>ĐIỀU CẦN NHỚ</small>${esc(s.takeaway)}</div>${source(s)}${mode==='trainer'?`<aside class="trainer-note"><small>GỢI Ý CHO GIẢNG VIÊN · Không ghi nhận tiến độ ở chế độ này</small>${esc(s.trainer)}<p style="margin:10px 0 0"><b>Mục tiêu bài:</b> ${esc(m.objective)}</p></aside>`:''}<details><summary>Lời thuyết minh & bản đọc</summary><p>${esc(s.narration)}</p></details><footer class="lesson-nav"><button data-slide="${id-1}" ${id===1?'disabled':''}>← Trước</button><div class="dots" aria-label="Các màn hình trong bài">${siblings.map(x=>`<button class="${x.id===id?'active':state().seen.includes(x.id)?'seen':''}" data-slide="${x.id}" aria-label="Màn hình ${x.id}: ${esc(x.title)}" title="${esc(x.title)}"></button>`).join('')}</div><small>${mode==='learner'?'Đã ghi nhận xem màn hình':'Chế độ giảng viên'}</small>${idx===3?`<button class="primary" data-practice="${s.module}">Luyện tập bài ${s.module} →</button>`:`<button class="primary" data-slide="${id+1}">Tiếp theo →</button>`}</footer></article>${audioBar()}`}
function audioBar(){return `<div class="audio no-print"><div class="tts-track"><i id="tts-progress"></i></div><button data-tts-prev aria-label="Màn hình trước" ${route.id===1?'disabled':''}>←</button><button data-pause class="primary">${speech.active?(speech.paused?'▶ Tiếp tục':'Ⅱ Tạm dừng'):'▶ Phát'}</button><button data-tts-next aria-label="Màn hình tiếp" ${route.id===C.slides.length?'disabled':''}>→</button><button data-speak>Đọc lại</button><button data-stop>Dừng</button><button data-mute aria-pressed="${speech.muted}">${speech.muted?'Bật tiếng':'Tắt tiếng'}</button><label>Tốc độ <select id="rate">${[0.9,1,1.2,1.4].map(r=>`<option value="${r}" ${speech.rate===r?'selected':''}>${String(r).replace('.',',')}×</option>`).join('')}</select></label><label><input id="auto-read" type="checkbox" ${speech.auto?'checked':''}>Tự chuyển</label><label><input id="pause-practice" type="checkbox" ${speech.stopAtPractice?'checked':''}>Dừng ở luyện tập</label><span id="audio-status" class="audio-status" role="status">${esc(speech.message)}</span><small class="tts-disclosure">Google Translate TTS · Cần Internet. Lời thuyết minh được gửi tới Google; không gửi thông tin học viên.</small></div>`}
const stationInfo=[['Bồn','Đáy dốc để lắng cặn và cửa xả cặn riêng; đầu vào hồi tiếp tuyến hoặc cút 45° hướng vào thành để chống tạo bọt; đầu nối hóa chất đậm đặc ở đỉnh, nhô vào ít nhất 5 mm; có thiết bị phun, nắp có khóa an toàn (§7.7.1, tr. 31–32).'],['Bơm','Bơm cấp: ly tâm có biến tần, tham khảo lưu lượng lớn nhất + 10%, áp suất 2,5–8 bar. Bơm hồi: xử lý được khí, khuyến nghị tự mồi, tham khảo lưu lượng bơm cấp + 30% (§7.7.2, tr. 34–35).'],['Gia nhiệt','Gia nhiệt trên đường cấp bảo đảm nhiệt độ đo ở đường hồi đạt điểm đặt. Trao đổi nhiệt tấm nên là loại tấm hàn; bộ gia nhiệt trong bồn dễ đóng cặn; phun hơi trực tiếp làm loãng dung dịch (§7.7.3, tr. 36–38).'],['Van','Mixproof hoặc block & bleed ở nơi rò rỉ có thể gây nhiễm. Van bướm, van một đế chỉ có một lớp kín. Chọn gioăng tương thích hóa chất; đủ điểm lấy mẫu ở vị trí phù hợp (§7.7.4, tr. 39–40).'],['Đo & lọc thô','Đường cấp: lưu lượng, nhiệt độ. Đường hồi: phát hiện dòng, nhiệt độ, độ dẫn điện. Hiệu chuẩn theo lịch. Lọc thô thường 3 mm, kiểm tra và làm sạch sau mỗi chu trình (§7.7.5–7.7.6, tr. 41–43).']];
const fmt=(n,d=2)=>n.toLocaleString('vi-VN',{maximumFractionDigits:d});
function velocityResult(q,d){const area=Math.PI*(d/1000)**2/4,v=Math.round(q/3600/area*100)/100,need=x=>fmt(x*area*3600,1);const note=v<1.5?'Dưới ngưỡng tối thiểu 1,5 m/s.':v<2?'Đạt ngưỡng tối thiểu 1,5 m/s. Chất bẩn khó có thể cần 2 m/s trở lên.':v<=4?'Từ 2 m/s trở lên.':'Trên 4 m/s: tăng thêm vận tốc chỉ cải thiện rất ít.';return `<div class="metric">${fmt(v)} <small>m/s</small></div><p>${note}<br>Cần <b>${need(1.5)} m³/h</b> cho 1,5 m/s · <b>${need(2)} m³/h</b> cho 2 m/s.${d>150?'<br>Ống trên 150 mm nằm ngoài phạm vi Doc. 50.':''}</p>`}
function teeResult(l,d,s){const tee=l<d,slope=s>=3;return `<div class="metric">${tee&&slope?'✓':'!'} <small>l/d = ${fmt(l/d)}</small></div><p>${tee?'Nhánh ngắn hơn đường kính của nó.':'Nhánh không ngắn hơn đường kính: rút ngắn hoặc đổi cấu hình van.'}<br>${slope?'Độ dốc đạt mức tối thiểu 3%.':'Độ dốc dưới 3%: xem lại khả năng thoát.'}<br><small>Đạt hai điều kiện này chưa chứng minh nhánh làm sạch được; vẫn phải chứng minh khả năng làm sạch.</small></p>`}
function icon(i){const drawings=['<path d="M14 14v26l16 12 16-12V14"/><ellipse cx="30" cy="14" rx="16" ry="6"/><path d="M14 28h32"/>','<circle cx="27" cy="33" r="17"/><circle cx="27" cy="33" r="4"/><path d="M27 16h25v9H42"/>','<path d="M10 10h40v8H10v8h40v8H10v8h40v8H10"/>','<path d="M8 22v22l22-11zM52 22v22L30 33z"/><path d="M30 33V13M21 13h18"/>','<path d="M6 46h48M30 46V27"/><circle cx="30" cy="17" r="10"/><path d="M30 17l5-5"/>'];return `<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${drawings[i]}</svg>`}
function visual(kind){if(!kind||kind==='hero')return '';let b='';
if(kind==='cipflow')b=`<div class="flow"><div class="node">Trạm CIP<small>Pha & giữ dung dịch</small></div><span class="arrow">→</span><div class="node">Đường cấp<small>Bơm · lưu lượng · nhiệt độ</small></div><span class="arrow">→</span><div class="node">Đối tượng<small>Qua đường phân phối</small></div><span class="arrow">→</span><div class="node">Đường hồi<small>Dòng · nhiệt độ · độ dẫn điện</small></div></div><p class="small" style="margin:12px 0 0">Đường hồi quay về trạm để thu hồi hoặc xả. Sơ đồ biên soạn từ §7.2 và Hình 6–7; không thay cho P&ID của cơ sở.</p>`;
if(kind==='steps')b=`<div class="flow">${[['Tráng sơ bộ','Loại bẩn rời'],['Rửa 1','Kiềm hoặc axit'],['Tráng','Nước uống được'],['Rửa 2','Axit hoặc kiềm'],['Tráng','Nước uống được'],['Khử trùng','Hóa chất / nhiệt'],['Tráng cuối','Nước uống được']].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node">${x[0]}<small>${x[1]}</small></div>`).join('')}</div><p class="small" style="margin:12px 0 0">Ví dụ chương trình 7 bước theo Bảng 3. Thu hồi sản phẩm trước CIP là điều kiện tiên quyết. Số bước thực tế do đánh giá rủi ro và thẩm định của cơ sở quyết định.</p>`;
if(kind==='concepts')b=`<div class="table-wrap"><table><caption style="text-align:left;margin-bottom:10px">Tóm tắt Bảng 4 · EHEDG Doc. 50 (2019), tr. 27</caption><thead><tr><th>Mô hình</th><th>Ứng dụng điển hình</th><th>Ưu điểm</th><th>Nhược điểm</th></tr></thead><tbody><tr><td>Một lần qua<br><small>không thu hồi</small></td><td>Chiết rót nguyên liệu lỏng giá trị cao; làm sạch không thường xuyên</td><td>Ít rủi ro nhiễm chéo; vốn thấp</td><td>Chi phí vận hành cao</td></tr><tr><td>Dùng một lần<br><small>không thu hồi</small></td><td>Tải bẩn nặng: UHT, cô đặc, thanh trùng, màng</td><td>Ít rủi ro nhiễm chéo; vốn thấp</td><td>Chi phí vận hành cao</td></tr><tr><td>Thu hồi<br><small>toàn phần / một phần</small></td><td>Sữa, đồ uống; làm sạch thường xuyên</td><td>Chi phí vận hành tương đối thấp hơn</td><td>Vốn cao; có thể nhiễm chéo</td></tr></tbody></table></div><p class="small" style="margin:10px 0 0">Bảng định hướng. Lựa chọn cuối cùng dựa trên tổng chi phí sở hữu và đánh giá rủi ro của cơ sở.</p>`;
if(kind==='station')b=`<div class="eyebrow">KHÁM PHÁ TRẠM CIP · CHỌN TỪNG BỘ PHẬN</div><p class="small">Các điểm thiết kế chính của từng nhóm thiết bị trong trạm.</p><div class="ahu">${stationInfo.map((x,i)=>`<button data-ahu="${i}" class="${i===0?'active':''}">${icon(i)}${x[0]}</button>`).join('')}</div><div class="explanation" id="ahu-info" role="status">${stationInfo[0][1]}</div>`;
if(kind==='timer')b=`<div class="eyebrow">THỬ BẬT TỪNG ĐIỀU KIỆN</div><p class="small">Mô hình minh họa nguyên tắc ở §6.2. Điểm đặt thực tế do thẩm định của cơ sở xác lập.</p><label class="check-row"><input type="checkbox" id="t-temp"><span>Nhiệt độ đường hồi đạt điểm đặt</span></label><label class="check-row"><input type="checkbox" id="t-conc"><span>Độ dẫn điện (nồng độ) đường hồi đạt điểm đặt</span></label><label class="check-row"><input type="checkbox" id="t-flow"><span>Lưu lượng đường cấp đạt điểm đặt</span></label><div id="timer-feedback" class="explanation" role="status">⏸ Bộ đếm dừng. Chưa điều kiện nào đạt.</div>`;
if(kind==='velocity')b=`<div class="eyebrow">TÍNH THỬ · KHÔNG PHẢI CÔNG CỤ THIẾT KẾ</div><div class="calc"><div class="fields"><label>Lưu lượng Q (m³/h)<input id="vel-q" type="number" min="0" max="100000" step="any" value="11"></label><label>Đường kính trong d (mm)<input id="vel-d" type="number" min="5" max="300" step="any" value="50"></label><small>v = 4·Q / (3600·π·d²), d tính bằng mét (Hình 1, tr. 9).</small></div><div class="calc-result" id="vel-result" role="status">${velocityResult(11,50)}</div></div>`;
if(kind==='tee')b=`<div class="eyebrow">KIỂM TRA NHANH · NHÁNH T VÀ ĐỘ DỐC</div><div class="calc"><div class="fields"><label>Chiều dài nhánh l (mm)<input id="tee-l" type="number" min="0" max="2000" step="any" value="40"></label><label>Đường kính nhánh d (mm)<input id="tee-d" type="number" min="5" max="300" step="any" value="50"></label><label>Độ dốc đường ống (%)<input id="tee-slope" type="number" min="0" max="100" step="any" value="3"></label></div><div class="calc-result" id="tee-result" role="status">${teeResult(40,50,3)}</div></div>`;
if(kind==='sequence')b=`<div class="eyebrow">BÀI TẬP SẮP XẾP</div><p>Đưa các bước về trình tự: từ yêu cầu người dùng đến duy trì trạng thái đã thẩm định. Dùng ↑ ↓.</p><ol class="sequence">${sequence.map((x,i)=>`<li><b>${i+1}</b><span>${x}</span><button data-seq="${i}" data-delta="-1" ${i===0?'disabled':''} aria-label="Đưa ${x} lên">↑</button><button data-seq="${i}" data-delta="1" ${i===sequence.length-1?'disabled':''} aria-label="Đưa ${x} xuống">↓</button></li>`).join('')}</ol><button data-seq-check>Kiểm tra thứ tự</button><div id="seq-result" role="status">${seqResult?`<p class="feedback">${seqResult}</p>`:''}</div>`;
if(kind==='scenario')b=scenarioView();
if(kind==='checklist')b=checklistView();
return `<section class="visual">${b}</section>`}
const checks=['Dung dịch trong bồn: độ trong, nồng độ, bọt; không có dấu hiệu khuẩn lạc bề mặt hoặc màng sinh học.','Bên trong bồn: vòm, cánh khuấy, thành không có bọt, cặn, bẩn; gioăng, cảm biến nguyên vẹn; đầu phun không tắc.','Không có vết hóa chất khô trên ống, khớp nối, van, bơm và sàn; đã tháo và kiểm tra lọc thô.','Định lượng: lượng hóa chất sử dụng đúng loại đã chỉ định; thiết bị và đường định lượng nguyên vẹn.','Kho hóa chất: nhãn và bao bì nguyên vẹn; vòi tắm khẩn cấp và bồn rửa mắt hoạt động; có khay chứa tràn.','Vận hành: trình tự, thời gian, nhiệt độ, lưu lượng, độ dẫn điện khớp chương trình; kết quả chuẩn độ khớp giá trị đo tự động.'];
function checklistView(){return `<div class="eyebrow">CHECKLIST THỰC HÀNH</div>${checks.map((x,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${state().checklist.includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}<div class="row" style="margin-top:17px"><button data-print-check>In phiếu mang về</button><small>Phiếu học tập · Điều chỉnh theo SOP trước khi áp dụng.</small></div>`}
function scenarioView(){if(scenarioStep>=2)return `<h3>Đã đi hết tình huống</h3><p class="feedback">Bạn đã chọn đánh giá dung dịch bằng dữ liệu ngoài độ dẫn điện, rồi làm sạch bồn và tìm nguyên nhân tích tụ. Quyết định thải bỏ và đưa bồn trở lại sử dụng thuộc thẩm quyền và tiêu chí của cơ sở.</p><button data-scenario-reset>Làm lại tình huống</button>`;
const steps=[{q:'Bồn kiềm thu hồi: độ dẫn điện vẫn ở điểm đặt, nhưng dung dịch sẫm màu, đục và kết quả kiểm tra bề mặt xấu dần. Bạn làm gì trước?',opts:['Tiếp tục dùng vì độ dẫn điện đạt.','Báo QA/kỹ thuật; chuẩn độ hydroxit và cacbonat, xem độ đục/COD và so với tiêu chí thải bỏ của cơ sở.','Định lượng thêm hóa chất đậm đặc để tăng độ dẫn điện.'],a:1,why:'Chất bẩn và muối hòa tan cũng đóng góp vào độ dẫn điện; cacbonat không phát hiện được bằng độ dẫn điện.'},{q:'Dung dịch đã được thải bỏ theo quyết định của cơ sở. Điều gì cần làm tiếp?',opts:['Pha ngay mẻ mới vào bồn để kịp lịch.','Chỉ tăng điểm đặt nồng độ cho mẻ sau.','Làm sạch bồn thu hồi, xem xét tráng sơ bộ và nguồn tải bẩn, ghi nhận trước khi pha mẻ mới.'],a:2,why:'Bồn thu hồi nên được làm sạch mỗi lần thải dung dịch; tích tụ thường do tải bẩn hoặc tráng sơ bộ không đủ.'}];const x=steps[scenarioStep];return `<div class="eyebrow">QUYẾT ĐỊNH ${scenarioStep+1} / 2 · TÌNH HUỐNG GIẢ ĐỊNH</div><h3>${x.q}</h3>${x.opts.map((o,i)=>`<button class="choice" data-scenario="${i}" data-answer="${x.a}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${scenarioWrong?`<div class="feedback bad" role="status">${scenarioWrong}</div>`:''}<small>Chọn để xem hệ quả. Có thể thử lại; không tính vào điểm thi cuối khóa.</small>`}
function practiceView(m){const module=C.modules[m-1],qs=practiceQuestions(m),s=state();return `<div class="eyebrow">LUYỆN TẬP / BÀI ${m}</div><h2>${esc(module.title)}</h2><p class="lead">Trả lời để nhận giải thích ngay. Có thể chọn lại sau khi ôn; kết quả này không phải điểm thi cuối khóa.</p>${qs.map(q=>{const v=(mode==='trainer'?trainerPractice:s.practice)[q.id],answered=Number.isInteger(v);return `<fieldset class="question-card"><legend>${esc(q.q)}</legend>${q.options.map((o,j)=>`<button class="choice ${v===j?(j===q.answer?'correct':'wrong'):''}" data-practice-q="${q.id}" data-option="${j}" aria-pressed="${v===j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}${answered?`<div class="feedback ${v===q.answer?'':'bad'}" role="status"><b>${v===q.answer?'Chính xác.':'Cần ôn lại.'}</b> ${esc(q.why)} <button data-slide="${q.slide}">Ôn màn hình ${q.slide}</button></div>`:''}</fieldset>`}).join('')}<div class="panel"><h3>${s.completed.includes(m)?'✓ Bài học đã hoàn thành':'Hoàn thành bài học'}</h3><p>Đã xem ${moduleSlides(m).filter(x=>s.seen.includes(x.id)).length}/4 màn hình · Luyện tập đúng ${countPractice(m)}/${qs.length} câu.</p>${mode==='trainer'?'<p class="notice">Chế độ giảng viên không cấp trạng thái hoàn thành. Chuyển về Học viên để ghi nhận việc học.</p>':`<button class="primary" data-complete="${m}" ${!canComplete(m)?'disabled':''}>${m<8?'Hoàn thành & sang bài tiếp →':'Hoàn thành & đến đánh giá →'}</button>`}<button data-slide="${moduleSlides(m)[0].id}">Xem lại bài</button></div>`}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){if(!db.active){askProfile(()=>startExam());return}if(!ready()||mode!=='learner'){notify('Hoàn thành 8 bài ở chế độ Học viên trước khi thi.');return}const s=state();if(s.exam&&!confirm('Bỏ lượt thi đang dở và tạo lượt mới?'))return;const ids=C.modules.flatMap(m=>shuffled(C.questions.filter(q=>q.module===m.id)).slice(0,C.examPerModule).map(q=>q.id));s.exam={ids:shuffled(ids),answers:{},started:new Date().toISOString()};save();go('exam')}
function examView(){const s=state(),exam=s.exam;if(!exam)return `<div class="eyebrow">ĐÁNH GIÁ CUỐI KHÓA</div><h2>Kiểm tra điều bạn đã hiểu.</h2><p class="lead">16 câu, chọn 2 câu từ mỗi bài trong ngân hàng 24 câu. Điểm và giải thích chỉ xuất hiện sau khi nộp.</p><div class="panel"><div class="grid"><div><h3>Đủ 8 bài</h3><p>Hiện tại: ${s.completed.length}/8 bài hoàn thành.</p></div><div><h3>Ngưỡng ${C.passPercent}%</h3><p>Cần đúng ít nhất ${needed()}/16 câu (${(needed()/16*100).toLocaleString('vi-VN')}%).</p></div><div><h3>Lưu từng lần làm</h3><p>Có thể thi lại. Các lượt đã nộp được giữ trong hồ sơ trên máy.</p></div></div><button class="primary" data-exam-start ${!ready()||mode!=='learner'?'disabled':''}>Bắt đầu đánh giá →</button>${!ready()?'<p class="small" style="margin:12px 0 0">Mở từng bài, xem đủ nội dung và hoàn thành luyện tập để mở bài thi.</p>':''}${mode==='trainer'?'<p class="notice">Chuyển sang Học viên để làm bài đánh giá.</p>':''}</div><button data-go="results">Xem lịch sử kết quả</button>`;
return `<div class="eyebrow">LƯỢT THI ĐANG THỰC HIỆN</div><h2>Đánh giá cuối khóa</h2><p class="muted">Có thể đổi lựa chọn trước khi nộp. Trả lời đủ 16 câu để chấm điểm.</p><div class="exam-progress row between"><strong id="exam-count">Đã trả lời ${Object.keys(exam.answers).length}/${exam.ids.length}</strong><button class="primary" data-submit-exam>Nộp bài</button></div>${exam.ids.map((id,i)=>{const q=C.questions.find(x=>x.id===id);return `<fieldset class="question-card" id="exam-q-${q.id}"><legend><small>CÂU ${i+1} / ${exam.ids.length} · BÀI ${q.module}</small><br>${esc(q.q)}</legend><div role="radiogroup" aria-label="Đáp án câu ${i+1}">${q.options.map((o,j)=>`<label class="choice ${exam.answers[id]===j?'selected':''}"><input type="radio" name="exam-${id}" data-exam-q="${id}" value="${j}" ${exam.answers[id]===j?'checked':''} style="width:auto;margin:0 10px 0 0">${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div></fieldset>`}).join('')}<div class="row"><button class="primary" data-submit-exam>Nộp bài & xem kết quả</button><button data-abandon-exam>Hủy lượt đang làm</button></div>`}
function submitExam(){const s=state(),e=s.exam;if(!e||mode!=='learner')return;if(!ready()){notify('Cần hoàn thành đủ các bài.');return}const missing=e.ids.find(id=>!Number.isInteger(e.answers[id]));if(missing){notify('Hãy trả lời đủ tất cả câu hỏi trước khi nộp.');$('#exam-q-'+missing).scrollIntoView({block:'center'});return}const score=e.ids.filter(id=>e.answers[id]===C.questions.find(q=>q.id===id).answer).length;const a={...e,score,total:e.ids.length,percent:score/e.ids.length*100,pass:score/e.ids.length*100>=C.passPercent,submitted:new Date().toISOString(),id:'CIP50-'+Date.now().toString(36).toUpperCase(),learner:{...profile().info},completed:[...s.completed],version:C.version};s.attempts.push(a);s.exam=null;save();go('results');}
function resultView(){const s=state(),attempt=s.attempts.at(-1);if(!attempt)return `<div class="eyebrow">HỒ SƠ HỌC TẬP</div><h2>Kết quả của bạn</h2><div class="panel"><p>Chưa có lượt đánh giá đã nộp. Bạn đã hoàn thành ${s.completed.length}/8 bài.</p><button class="primary" data-go="exam">Đến đánh giá</button> <button data-export>Xuất tiến độ hiện tại</button></div>`;return `<div class="no-print"><div class="eyebrow">KẾT QUẢ / LƯỢT GẦN NHẤT</div><h2>${attempt.pass?'Bạn đã đạt bài đánh giá.':'Hãy ôn lại rồi thử tiếp.'}</h2><div class="panel"><div class="row between"><div><div class="metric">${attempt.score}<small> / ${attempt.total} câu</small></div><p>${attempt.percent.toLocaleString('vi-VN')}% · ${attempt.pass?'Đạt':'Chưa đạt'} · Ngưỡng ${C.passPercent}%</p></div><div><button class="primary" data-exam-start>Thi lại</button> <button data-export>Xuất JSON</button> <button data-csv>Xuất CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Nhóm kiến thức</th><th>Kết quả</th><th>Ôn tập</th></tr></thead><tbody>${C.modules.map(m=>{const ids=attempt.ids.filter(id=>C.questions.find(q=>q.id===id)?.module===m.id);const correct=ids.filter(id=>attempt.answers[id]===C.questions.find(q=>q.id===id).answer).length;return `<tr><td>${m.id}. ${esc(m.title)}</td><td>${correct}/${ids.length}</td><td><button data-slide="${moduleSlides(m.id)[0].id}">Ôn bài</button></td></tr>`}).join('')}</tbody></table></div></div></div>${attempt.pass?certificate(attempt):''}<div class="no-print"><h3 style="margin-top:30px">Xem lại đáp án & giải thích</h3>${attempt.ids.map((id,i)=>{const q=C.questions.find(x=>x.id===id),a=attempt.answers[id];return `<details><summary>${i+1}. ${a===q.answer?'✓':'○'} ${esc(q.q)}</summary><p>Bạn chọn: ${esc(q.options[a])}<br><b>Đáp án: ${esc(q.options[q.answer])}</b></p><p>${esc(q.why)}</p><button data-slide="${q.slide}" style="margin-bottom:15px">Ôn màn hình ${q.slide}</button></details>`}).join('')}<div class="panel"><h3>Lịch sử ${s.attempts.length} lượt thi</h3>${[...s.attempts].reverse().map(a=>`<div class="history-item"><b>${a.score}/${a.total} · ${a.pass?'Đạt':'Chưa đạt'}</b> <small>${new Date(a.submitted).toLocaleString('vi-VN')}</small><br><small>${esc(a.id)}</small></div>`).join('')}</div></div>`}
function certificate(a){return `<section id="cert-area"><div class="row no-print" style="margin-top:25px"><button class="primary" data-print-cert>In / lưu PDF xác nhận</button><small>Chọn “Lưu dưới dạng PDF” trong hộp thoại in của trình duyệt.</small><label>Họ tên in trên xác nhận (tùy chọn)<input id="cert-name" maxlength="80" autocomplete="name" value="${esc(a.learner.name)}" placeholder="Có thể để trống"></label></div><div class="certificate"><div class="eyebrow">CIP ACADEMY · ĐÀO TẠO NỘI BỘ</div><h2>XÁC NHẬN HOÀN THÀNH KHÓA HỌC</h2><div class="cert-line"></div><p class="learner-name">${esc(a.learner.name)||'……………………………………'}</p><p>Đã hoàn thành 8 bài học và bài đánh giá</p><h3>${esc(C.title)}</h3><p>Điểm: <b>${a.score}/${a.total} · ${a.percent.toLocaleString('vi-VN')}%</b></p><p>Ngày hoàn thành: ${new Date(a.submitted).toLocaleDateString('vi-VN')}</p><div class="cert-line"></div><small>Nội dung biên soạn từ EHEDG Doc. 50, tháng 7/2019 · Khóa ${esc(C.id)} · v${esc(a.version)}</small><small>Mã bản ghi cục bộ: ${esc(a.id)}</small><small>Biên soạn khóa học: Đặng Thanh Bình · dangthanhbinh53@gmail.com</small><small style="margin-top:15px">Đây là xác nhận học tập nội bộ do ứng dụng tạo từ dữ liệu trên máy.<br>Không phải chứng nhận của EHEDG; chưa xác minh danh tính hoặc năng lực thực hành.</small></div></section>`}
function resources(){return `<div class="eyebrow">TRA CỨU & MANG VỀ CÔNG VIỆC</div><h2>Tài liệu, công cụ & phạm vi</h2><p class="lead">Các bài học dẫn về trang và mục của tài liệu gốc để QA, kỹ thuật và giảng viên kiểm tra lại.</p><div class="panel"><h3>Nguồn chính</h3><p><b>EHEDG Doc. 50 — Hygienic Design Requirements for CIP Installations.</b><br>July 2019 · 94 trang · © EHEDG.</p><p>Biên soạn tiếng Việt từ PDF do người dùng cung cấp. Bản tiếng Anh là bản chính thức. App không bao gồm toàn bộ PDF và không xác nhận các tiêu chuẩn, quy định viện dẫn trong bản 2019 là phiên bản hiện hành.</p><p class="notice">Khi dùng để thiết kế, mua sắm hoặc xây SOP: đối chiếu bản tài liệu gốc, tiêu chuẩn áp dụng, yêu cầu địa phương, khuyến nghị của nhà cung cấp thiết bị/hóa chất, đánh giá rủi ro và thông số đã được cơ sở thẩm định.</p><ol class="source-index">${C.modules.map(m=>`<li><b>${esc(m.title)}</b><br><small>${moduleSlides(m.id).map(s=>`${s.id}: ${esc(s.source)}`).join(' · ')}</small></li>`).join('')}</ol></div><div class="panel"><h3>Bảng thuật ngữ ngắn</h3><div class="table-wrap"><table><tbody>${[['CIP','Làm sạch tại chỗ: tuần hoàn/cho chảy dung dịch và nước tráng qua bề mặt mà không tháo rời'],['Mạch CIP','Mọi đoạn ống và thiết bị được làm sạch trong một chu trình CIP'],['Đối tượng làm sạch','Thiết bị hoặc cụm công nghệ được nối với hệ thống CIP'],['Single pass / Single use / Re-use','Một lần qua rồi xả / pha mới và xả sau mỗi bước / thu hồi về bồn để dùng lại'],['Self-draining / Drainable','Tự thoát chỉ nhờ trọng lực / thoát được nhờ biện pháp hỗ trợ'],['Block & bleed','Hai lớp chặn với một cửa mở ở giữa để dẫn rò rỉ ra ngoài'],['Mixproof','Van hai đế có khoang rò, tích hợp nguyên lý block & bleed'],['TCO','Tổng chi phí sở hữu: vốn đầu tư và chi phí vận hành'],['COD','Nhu cầu ôxy hóa học; chỉ báo tải hữu cơ trong dung dịch/nước thải'],['URS','Yêu cầu của người sử dụng'],['DQ / IQ / FQ (OQ) / PQ','Đánh giá thiết kế / lắp đặt / chức năng (vận hành) / hiệu năng'],['P&ID','Sơ đồ đường ống và thiết bị đo']].map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Phiếu áp dụng tại cơ sở</h3><p>Chọn một trạm CIP hoặc mạch thực tế. Ghi mô hình CIP, dung dịch, thông số đã thẩm định và người chịu trách nhiệm. Phiếu cần được cơ sở duyệt trước khi đưa vào SOP.</p>${checklistView()}</div><section class="author"><span class="avatar" aria-hidden="true">ĐB</span><div><small>Biên soạn & thiết kế khóa học</small><b>Đặng Thanh Bình</b><a href="mailto:dangthanhbinh53@gmail.com">dangthanhbinh53@gmail.com</a><p>© 2026 Đặng Thanh Bình. Bản quyền thuộc về tác giả đối với phần biên soạn tiếng Việt, ví dụ minh họa, thiết kế và phần mềm khóa học. Nội dung gốc EHEDG Doc. 50 © EHEDG.</p></div></section><div class="panel"><h3>Dữ liệu & cách sử dụng</h3><p>App chạy trong một file HTML, không gửi điểm hoặc thông tin học viên tới máy chủ. Không cần nhập thông tin cá nhân. Tiến độ lưu trong trình duyệt hiện tại; xóa dữ liệu trình duyệt hoặc chuyển máy có thể mất tiến độ.</p><p>Chức năng đọc dùng Google Translate TTS giống app mẫu: tiếng Việt, chia đoạn ngắn, thử tw-ob rồi gtx khi có lỗi. Cần Internet; lời thuyết minh được gửi tới Google, không gửi hồ sơ học viên. Dịch vụ có thể chặn hoặc giới hạn yêu cầu; khi không phát được, app dừng và cho phép đọc lại hoặc xem thủ công.</p><div class="row"><button data-export>Xuất hồ sơ JSON</button><button data-csv>Xuất lịch sử CSV</button><button data-profile>Đổi học viên</button><button data-reset>Xóa tiến độ học</button></div><p class="small" style="margin-top:15px">File xuất chứa thông tin học viên. JSON là bản lưu để kiểm tra/tổng hợp; bản này chưa có chức năng nhập phục hồi. CSV gồm các lượt thi đã nộp.</p></div><div id="print-checklist" hidden>${printChecklist()}</div>`}
function printChecklist(){return `<h2>Phiếu áp dụng · Kiểm tra định kỳ hệ thống CIP</h2><p>Khóa học từ EHEDG Doc.50 (2019) · Phiếu học tập, chưa phải SOP.</p><p>Người học: ................................................ Bộ phận: ................................</p><p>Trạm CIP / mạch / đối tượng: ..................................................................</p><p>Mô hình CIP & dung dịch sử dụng: ................................................................</p><p>Thông số / tiêu chí đã thẩm định: ................................................................</p><ul>${checks.map(x=>`<li>□ ${x}</li>`).join('')}</ul><p>Phát hiện / hành động / người phụ trách: ....................................................</p><p>...................................................................................................................</p><p>Người xem xét: ..................................... Ngày: ..........................................</p><p><small>Tham chiếu: §10.4, tr.67–69; §7.8.2–7.8.3, tr.46–48. Điều chỉnh theo thiết kế, rủi ro và SOP của cơ sở.</small></p>`}
function fitDeck(){const el=document.querySelector('.lesson');if(!el)return;el.style.setProperty('--deck-zoom','1');if(!document.body.classList.contains('present'))return;const avail=innerHeight-28;let z=1;for(let i=0;i<10;i++){const height=el.getBoundingClientRect().height;if(!height)break;const next=Math.min(1.7,Math.max(.5,z*Math.pow(avail/height,.6)));if(Math.abs(next-z)<.003)break;z=next;el.style.setProperty('--deck-zoom',String(z))}}
let chromeTimer=null;
function peekChrome(ms=2600,which='both'){const b=document.body;if(which!=='bottom')b.classList.add('show-top');if(which!=='top')b.classList.add('show-bottom');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>b.classList.remove('show-top','show-bottom'),ms)}
function enterPresent(){document.body.classList.add('present');peekChrome(3500);notify('Đưa chuột tới mép trên hoặc mép dưới để hiện thanh điều khiển. Esc để thoát.')}
document.addEventListener('mousemove',e=>{if(!document.body.classList.contains('present'))return;if(e.clientY<70)peekChrome(2600,'top');else if(e.clientY>innerHeight-110)peekChrome(2600,'bottom')});
document.addEventListener('touchstart',()=>{if(document.body.classList.contains('present'))peekChrome(4000)},{passive:true});
document.addEventListener('animationend',e=>{if(e.target.classList&&e.target.classList.contains('lesson'))fitDeck()});
window.addEventListener('resize',()=>requestAnimationFrame(fitDeck));
document.addEventListener('toggle',()=>requestAnimationFrame(fitDeck),true);

function askProfile(cb){speech.stop();pending=cb||null;const i=profile().info;$('#emp-id').value=i.id;$('#emp-name').value=i.name;$('#emp-dept').value=i.dept;$('#profile-error').textContent='';$('#profile-dialog').showModal()}

function safeName(s){return String(s).replace(/[^\p{L}\p{N}_-]/gu,'_').slice(0,40)||'learner'}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

// Same Google Translate TTS endpoint and client fallback as the supplied HACCP app.
// Only course narration is sent; learner records never enter a request URL.
const speech={audio:new Audio(),available:true,auto:true,stopAtPractice:false,muted:false,token:0,active:false,paused:false,rate:1.2,parts:[],index:0,pending:null,timer:null,advanceTimer:null,message:'Sẵn sàng · Google TTS · cần Internet',loadTimeout:25000,
 status(t){this.message=t;this.sync();if(/chặn|Không phát được/.test(t)&&document.body.classList.contains('present'))peekChrome(8000)},
 sync(){const el=$('#audio-status');if(el)el.textContent=this.message;const p=$('[data-pause]');if(p)p.textContent=this.active?(this.paused?'▶ Tiếp tục':'Ⅱ Tạm dừng'):'▶ Phát';const mute=$('[data-mute]');if(mute){mute.textContent=this.muted?'Bật tiếng':'Tắt tiếng';mute.setAttribute('aria-pressed',String(this.muted))}const line=$('#tts-progress');if(line)line.style.width=(this.parts.length?this.index/this.parts.length*100:0)+'%';},
 url(text,client='tw-ob'){return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&total=1&idx=0&client='+client+'&q='+encodeURIComponent(text)+'&textlen='+text.length},
 normalize(t){return t.replace(/\bCIP\b/g,'xi ai pi').replace(/\bSIP\b/g,'ét ai pi').replace(/\bUHT\b/g,'iu hát ti').replace(/\bATP\b/g,'ây ti pi').replace(/\bDQ\b/g,'đi kiu').replace(/\bFQ\b/g,'ép kiu').replace(/\bURS\b/g,'iu a ét').replace(/\bIQ\b/g,'ai kiu').replace(/\bOQ\b/g,'âu kiu').replace(/\bPQ\b/g,'pi kiu').replace(/\bSOP\b/g,'ét âu pi').replace(/\bQA\b/g,'kiu ây').replace(/\bHACCP\b/g,'hát xắp').replace(/axit/gi,'a xít').replace(/cacbonic/gi,'các bô níc').replace(/cacbonat/gi,'các bô nát').replace(/\bclo\b/gi,'cờ lo').replace(/\bEHEDG\b/g,'i hát i đi gi').replace(/\s+/g,' ').trim()},
 split(t){const sentences=this.normalize(t).match(/[^.!?]+[.!?]?/g)||[];const out=[];for(const sentence of sentences){let line='';for(const word of sentence.trim().split(/\s+/)){if((line+' '+word).trim().length>170){if(line)out.push(line);line='';}if(word.length>170){for(let i=0;i<word.length;i+=170)out.push(word.slice(i,i+170));}else line=(line+' '+word).trim();}if(line)out.push(line);}return out},
 settle(ok){clearTimeout(this.timer);this.timer=null;const resolve=this.pending;this.pending=null;this.audio.onended=null;this.audio.onerror=null;this.audio.onplaying=null;this.audio.onwaiting=null;this.audio.onstalled=null;if(resolve)resolve(ok)},
 stop(){this.token++;clearTimeout(this.advanceTimer);this.advanceTimer=null;this.active=false;this.paused=false;this.audio.pause();this.settle(false);this.audio.removeAttribute('src');this.audio.load();this.status('Đã dừng đọc.')},
 speak(text,token){return new Promise(resolve=>{this.pending=resolve;let attemptId=0;const attempt=client=>{const attemptToken=++attemptId;if(token!==this.token){this.settle(false);return}const valid=()=>token===this.token&&attemptToken===attemptId&&!!this.pending;const a=this.audio;const fail=err=>{if(!valid())return;clearTimeout(this.timer);if(err?.name==='NotAllowedError'){this.settle(false);this.status('Trình duyệt chặn âm thanh. Bấm Phát hoặc Đọc lại để tiếp tục.');return}if(client==='tw-ob')attempt('gtx');else{this.settle(false);this.status('Không phát được Google TTS. Kiểm tra Internet rồi bấm Đọc lại; vẫn có thể xem thủ công.')}};this.armTimeout=()=>{clearTimeout(this.timer);if(valid()&&!this.paused)this.timer=setTimeout(()=>fail(),this.loadTimeout)};a.pause();a.onended=()=>{if(valid())this.settle(true)};a.onerror=fail;a.onplaying=()=>{if(valid()){clearTimeout(this.timer);this.timer=null}};a.onwaiting=this.armTimeout;a.onstalled=this.armTimeout;a.src=this.url(text,client);a.playbackRate=this.rate;a.preservesPitch=true;a.muted=this.muted;this.armTimeout();if(!this.paused){try{a.play().catch(fail)}catch(err){fail(err)}}};attempt('tw-ob')})},
 async start(){this.stop();if(route.type!=='slide')return;const slide=C.slides.find(s=>s.id===route.id);const token=this.token;this.parts=this.split(slide.narration);this.index=0;this.active=true;this.status('Đang tải giọng Google · màn hình '+slide.id);for(this.index=0;this.index<this.parts.length;this.index++){if(token!==this.token)return;while(this.paused){await new Promise(r=>setTimeout(r,80));if(token!==this.token)return}this.status('Google TTS · màn hình '+slide.id+' · đoạn '+(this.index+1)+'/'+this.parts.length);const ok=await this.speak(this.parts[this.index],token);if(token!==this.token)return;if(!ok){this.active=false;this.paused=false;this.audio.pause();this.sync();return}}if(token!==this.token)return;this.status('Đã đọc xong màn hình '+slide.id);if(!this.auto){this.active=false;this.sync();return}this.status('Đã đọc xong · sắp chuyển màn hình');const advance=()=>{if(token!==this.token||!this.auto){this.active=false;this.sync();return}if(this.paused){this.advanceTimer=setTimeout(advance,100);return}this.active=false;const last=moduleSlides(slide.module).at(-1).id;if(this.stopAtPractice&&slide.id===last){go('practice',slide.module);notify('Đã dừng để luyện tập bài '+slide.module+'.');return}if(slide.id===C.slides.at(-1).id){this.status('Đã trình chiếu hết 32 màn hình. Hoàn thành luyện tập các bài để mở đánh giá.');notify('Đã đọc hết khóa học. Việc xem tự động không thay thế luyện tập và bài thi.');return}go('slide',slide.id+1);this.start()};this.advanceTimer=setTimeout(advance,900)},
 pause(){if(!this.active){this.start();return}if(this.paused){this.paused=false;this.status('Đang tiếp tục đọc');if(this.pending){this.armTimeout?.();this.audio.play().catch(e=>{if(e.name==='NotAllowedError'){this.stop();this.status('Âm thanh bị chặn. Bấm Đọc lại.')}})}}else{this.paused=true;clearTimeout(this.timer);this.audio.pause();this.status('Đã tạm dừng')}this.sync()},
 setRate(v){this.rate=Number(v);this.audio.playbackRate=this.rate},
 mute(){this.muted=!this.muted;this.audio.muted=this.muted;this.sync()}
};
